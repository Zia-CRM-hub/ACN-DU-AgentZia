# Disabled schedule: status is generated locally (scripts/run_hourly_local.cmd). Manual run only.
name: Status (manual only)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 scripts/generate_status.py
