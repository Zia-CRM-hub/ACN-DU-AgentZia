name: Hourly delivery status
on:
  push:
    branches: [main]
    paths: ["docs/**", ".claude/agents/**"]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 scripts/generate_status.py
      - name: Commit if changed
        run: |
          git config user.name "AgentZ status bot"
          git config user.email "agentz-bot@users.noreply.github.com"
          git add docs/status/index.html
          git diff --cached --quiet || (git commit -m "chore: hourly status update" && git push)
